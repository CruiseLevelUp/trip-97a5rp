<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f3b59">
<title>沖繩家庭旅遊</title>

<!-- ═══════════════════════════════════════════════════════════════
     旅遊網站 · 地中海夏日風 · 由 Claude 製作
     配色：Yale Blue #0f3b59 / Goldenrod #dba12c / 奶油白 #f4efe6 / Dark Coffee #3e251e
     字型：Jost（近 Century Gothic）+ Noto Sans TC
     改內容 → 找 <script id="trip-data">；加照片 → 圖放 images/ 再到 album 加檔名
     ═══════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --blue:#0f3b59;        /* Yale Blue 主色 */
    --blue-deep:#0a2c44;   /* 深藍 */
    --steel:#7d929e;       /* Cool Steel 次要 */
    --cream:#f4efe6;       /* 奶油白 背景 */
    --cream-card:#fffdf8;  /* 卡片底 */
    --gold:#dba12c;        /* Goldenrod 強調 */
    --gold-deep:#b07d16;   /* 深金（白底可讀文字） */
    --coffee:#3e251e;      /* Dark Coffee 文字 */
    --line:#e6ddcd;
    --shadow:0 8px 26px rgba(15,59,89,.13);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Jost","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--cream); color:var(--coffee); line-height:1.65;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block}

  /* ── 頁首（藍白遮陽棚條紋） ── */
  header{
    background:var(--blue); color:var(--cream);
    padding:calc(30px + var(--safe-t)) 20px 30px; text-align:center; position:relative; overflow:hidden;
  }
  header::before{ /* 頂端遮陽棚條紋 */
    content:"";position:absolute;top:0;left:0;right:0;height:16px;
    background:repeating-linear-gradient(90deg,var(--cream) 0 24px,var(--gold) 24px 48px);opacity:.9;
  }
  header::after{content:"🍋";position:absolute;font-size:130px;opacity:.10;right:-14px;bottom:-34px;transform:rotate(-12deg)}
  header h1{font-size:1.75rem;font-weight:700;letter-spacing:1.5px;margin-top:6px}
  header .dates{margin-top:10px;opacity:.9;font-size:.95rem;letter-spacing:1.5px;font-weight:400}

  /* ── 分頁列 ── */
  nav{
    position:sticky;top:0;z-index:50;background:var(--cream-card);
    display:flex;overflow-x:auto;box-shadow:0 2px 10px rgba(15,59,89,.08);
    border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:1 0 auto;min-width:76px;padding:14px 10px;border:none;background:none;
    font-family:inherit;font-size:.92rem;font-weight:500;color:var(--steel);cursor:pointer;
    border-bottom:3px solid transparent;transition:.15s;white-space:nowrap;
  }
  nav button.active{color:var(--blue);border-bottom-color:var(--gold);font-weight:700}

  main{max-width:820px;margin:0 auto;padding:22px 16px calc(60px + var(--safe-b))}
  .tab{display:none;animation:fade .28s ease}
  .tab.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  h2.section-title{font-size:1.35rem;font-weight:600;letter-spacing:.5px;margin:6px 0 18px;color:var(--blue)}

  /* ── 旅程資訊卡 ── */
  .info-card{background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:var(--cream);
    border-radius:18px;padding:16px 18px 14px;margin-bottom:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .info-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 28px);opacity:.8}
  .info-card .info-title{font-weight:700;font-size:1.02rem;letter-spacing:1px;margin-bottom:8px;padding-top:4px}
  .info-card .info-row{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.13);font-size:.9rem;line-height:1.5}
  .info-card .info-row:last-child{border-bottom:none}
  .info-card .ic{flex:0 0 auto;font-size:1.05rem;line-height:1.4}
  .info-card b{color:var(--gold);font-weight:600;margin-right:5px}
  .info-card .sub{color:#c3d2da;font-size:.82rem}
  .info-card a.imap{color:var(--gold);text-decoration:none;font-weight:600;font-size:.8rem;white-space:nowrap}
  .hint{background:#fbf3e0;border:1px solid #eeddb8;color:#8a6a2e;font-size:.82rem;
    padding:11px 13px;border-radius:12px;margin-bottom:18px;line-height:1.55}

  /* ── 行程卡 ── */
  .day{background:var(--cream-card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
  .day-head{background:var(--blue);color:var(--cream);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:relative}
  .day-head::before{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;
    background:repeating-linear-gradient(90deg,var(--gold) 0 16px,transparent 16px 32px);opacity:.7}
  .day-head .d-num{font-weight:700;font-size:1.1rem;letter-spacing:1px}
  .day-head .d-date{opacity:.9;font-size:.85rem;letter-spacing:.5px}
  .day-body{padding:8px 18px 16px}
  .stop{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
  .stop:last-child{border-bottom:none}
  .stop .time{flex:0 0 54px;font-weight:600;color:var(--gold-deep);font-size:.9rem;padding-top:2px}
  .stop .info{flex:1}
  .stop .info .name{font-weight:600;font-size:1.02rem}
  .stop .info .desc{font-size:.87rem;color:var(--steel);margin-top:3px}
  .stop .info a.map{display:inline-block;margin-top:8px;font-size:.82rem;color:var(--blue);
    text-decoration:none;font-weight:600;background:#eaf1f5;padding:4px 12px;border-radius:999px}
  .stop .info a.map:active{background:#dbe7ee}

  /* ── 相簿 ── */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
  .gallery figure{position:relative;margin:0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
  .gallery img{aspect-ratio:1;object-fit:cover;width:100%;transition:.25s;cursor:pointer}
  .gallery figure:active img{transform:scale(1.05)}
  .gallery figcaption{font-size:.74rem;color:var(--steel);padding:6px;text-align:center}
  .ph-del{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:none;
    background:rgba(10,44,68,.6);color:#fff;font-size:.9rem;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0}
  .ph-del:active{background:rgba(176,85,63,.9)}
  .ph-badge{position:absolute;bottom:5px;left:5px;background:rgba(15,59,89,.82);color:var(--cream);
    font-size:.62rem;padding:2px 7px;border-radius:999px;letter-spacing:.5px}
  .add-photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px}
  #photo-status{text-align:center;color:var(--steel);font-size:.86rem;margin-bottom:14px;display:none}
  .album-empty{text-align:center;color:var(--steel);padding:44px 12px;line-height:1.9}
  #lightbox{position:fixed;inset:0;background:rgba(10,44,68,.94);display:none;z-index:100;
    align-items:center;justify-content:center;flex-direction:column;padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b))}
  #lightbox.on{display:flex}
  #lightbox img{max-height:76vh;max-width:100%;border-radius:10px}
  #lightbox .cap{color:var(--cream);margin-top:14px;font-size:.92rem;letter-spacing:.5px}
  #lightbox .close{position:absolute;top:calc(16px + var(--safe-t));right:20px;color:#fff;font-size:2rem;cursor:pointer;line-height:1}
  #lightbox .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:2.6rem;cursor:pointer;padding:0 14px;user-select:none;opacity:.85}
  #lightbox .prev{left:2px}#lightbox .next{right:2px}

  /* ── 卡片/表單 ── */
  .card{background:var(--cream-card);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  input,select,button.btn{font-family:inherit;font-size:1rem;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:12px;background:#fff;color:var(--coffee);width:100%}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  button.btn{background:var(--gold);color:var(--coffee);border:none;font-weight:700;font-size:1.02rem;cursor:pointer;letter-spacing:.5px}
  button.btn:active{background:var(--gold-deep);color:#fff}
  .totals{display:flex;justify-content:space-between;align-items:baseline;padding:9px 4px;border-bottom:1px solid var(--line)}
  .totals.grand{font-size:1.2rem;font-weight:700;color:var(--blue);border:none;padding-top:14px}
  .exp-item{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px dashed var(--line)}
  .exp-item .meta{font-size:.85rem;color:var(--steel)}
  .exp-item .amt{font-weight:700}
  .exp-item .del{color:#b0553f;cursor:pointer;font-size:.8rem;margin-left:12px;flex:0 0 auto}
  .cat-tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;background:#eaf1f5;color:var(--blue);margin-right:6px;font-weight:500}

  /* ── 換匯 ── */
  .conv-big{font-size:2.1rem;font-weight:700;color:var(--blue);text-align:center;margin:8px 0;letter-spacing:.5px}
  .conv-rate{text-align:center;color:var(--steel);font-size:.85rem;margin-bottom:16px}
  .swap{text-align:center;margin:12px 0}
  .swap button{background:var(--cream);border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:.92rem;color:var(--coffee)}
  .swap button:active{background:#ece3d2}

  footer{text-align:center;color:var(--steel);font-size:.78rem;padding:24px 16px calc(40px + var(--safe-b));letter-spacing:.5px}
  label.lbl{font-size:.8rem;color:var(--steel);display:block;margin-bottom:5px;font-weight:500}
  a.card{text-decoration:none;color:inherit}
</style>
</head>
<body>

<header>
  <h1 id="trip-title">🌊 沖繩家庭旅遊</h1>
  <div class="dates">🚗 家庭自駕 · 美食 · 海景 🍋</div>
</header>

<nav>
  <button class="active" data-tab="itinerary">📅 行程</button>
  <button data-tab="album">📸 相簿</button>
  <button data-tab="expense">📝 記帳</button>
  <button data-tab="convert">💱 換匯</button>
  <button data-tab="map">🗺️ 地圖</button>
</nav>

<main>
  <section class="tab active" id="itinerary">
    <h2 class="section-title">📅 每日行程</h2>
    <div id="trip-info"></div>
    <div id="days"></div>
  </section>

  <section class="tab" id="album">
    <h2 class="section-title">📸 旅行相簿</h2>
    <div class="hint">📱 按下方按鈕就能從手機選照片。照片存在<b>「這支手機」</b>裡（只有你自己看得到，換手機／換人看不到）。想讓<b>全家都看到</b>，把照片用 Discord 傳給我放進共享相簿。</div>
    <input id="photo-input" type="file" accept="image/*" multiple style="display:none">
    <button class="btn add-photo-btn" onclick="document.getElementById('photo-input').click()">📷 從手機選照片</button>
    <div id="photo-status">處理中…</div>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="tab" id="expense">
    <h2 class="section-title">📝 旅遊記帳</h2>
    <div class="hint">資料只存在你這支手機的瀏覽器裡，不會上傳，換裝置看不到。</div>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <div style="flex:2"><label class="lbl">項目</label><input id="e-name" placeholder="例：午餐 拉麵"></div>
        <div><label class="lbl">金額(¥)</label><input id="e-amt" type="number" inputmode="numeric" placeholder="0"></div>
      </div>
      <div class="row" style="margin-bottom:14px">
        <div><label class="lbl">分類</label>
          <select id="e-cat">
            <option>餐飲</option><option>交通</option><option>購物</option>
            <option>門票</option><option>住宿</option><option>雜項</option>
          </select>
        </div>
        <div><label class="lbl">日期</label><input id="e-date" type="date"></div>
      </div>
      <button class="btn" onclick="addExpense()">➕ 新增支出</button>
    </div>
    <div class="card" id="totals-card"></div>
    <div class="card"><div id="exp-list"></div></div>
  </section>

  <section class="tab" id="convert">
    <h2 class="section-title">💱 日幣 ↔ 台幣</h2>
    <div class="card">
      <div id="conv-out" class="conv-big">¥1,000 ≈ NT$210</div>
      <div class="conv-rate" id="conv-rate"></div>
      <div><label class="lbl" id="conv-in-lbl">輸入日幣金額 (¥)</label>
        <input id="conv-in" type="number" inputmode="numeric" value="1000" oninput="doConvert()"></div>
      <div class="swap"><button onclick="swapConvert()">🔄 切換方向</button></div>
      <div><label class="lbl">匯率（1 台幣 = ? 日幣，可自行修改）</label>
        <input id="conv-rate-input" type="number" step="0.01" value="4.76" oninput="doConvert()"></div>
    </div>
  </section>

  <section class="tab" id="map">
    <h2 class="section-title">🗺️ 景點導航</h2>
    <div class="hint">點任一地點會直接開啟 Google 地圖導航。</div>
    <div id="map-list"></div>
  </section>
</main>

<div id="lightbox">
  <span class="close" onclick="closeLb()">✕</span>
  <span class="nav-arrow prev" onclick="stepLb(-1)">‹</span>
  <span class="nav-arrow next" onclick="stepLb(1)">›</span>
  <img id="lb-img" src="" alt="">
  <div class="cap" id="lb-cap"></div>
</div>

<footer>用 🍋 製作 · 資料存在本機瀏覽器 · 家庭專屬</footer>

<!-- ═══════════════════════════════════════════════════════════════
     ▼▼▼  要改內容就改這一區 trip-data  ▼▼▼
     ═══════════════════════════════════════════════════════════════ -->

<!-- ▲▲▲  以下是程式邏輯，通常不用改  ▲▲▲ -->
<script>
  document.querySelectorAll('nav button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(b.dataset.tab).classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });

  document.getElementById('trip-title').textContent = TRIP.title;

  const mapUrl = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;

  if(TRIP.info){
    const I=TRIP.info;
    document.getElementById('trip-info').innerHTML = `
      <div class="info-card">
        <div class="info-title">🧳 旅程資訊</div>
        <div class="info-row"><span class="ic">✈️</span><div><b>去程</b>${I.flightOut}</div></div>
        <div class="info-row"><span class="ic">🛬</span><div><b>回程</b>${I.flightBack}</div></div>
        <div class="info-row"><span class="ic">🏨</span><div><b>飯店</b>${I.hotel}<br><span class="sub">${I.hotelDates}</span> ${I.hotelMap?`<a class="imap" href="${mapUrl(I.hotelMap)}" target="_blank" rel="noopener">📍導航</a>`:''}</div></div>
        <div class="info-row"><span class="ic">🚗</span><div><b>租車</b>${I.car}<br><span class="sub">${I.carNote}</span></div></div>
        <div class="info-row"><span class="ic">🚐</span><div><b>接送</b>${I.transfer}</div></div>
      </div>`;
  }

  document.getElementById('days').innerHTML = TRIP.days.map(d=>`
    <div class="day">
      <div class="day-head"><span class="d-num">${d.n}</span></div>
      <div class="day-body">
        ${d.stops.map(s=>`
          <div class="stop">
            <div class="time">${s.time}</div>
            <div class="info">
              <div class="name">${s.name}</div>
              ${s.desc?`<div class="desc">${s.desc}</div>`:''}
              ${s.map?`<a class="map" href="${mapUrl(s.map)}" target="_blank" rel="noopener">📍 導航到這裡</a>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');

  const allStops=[]; TRIP.days.forEach(d=>d.stops.forEach(s=>{if(s.map)allStops.push(s)}));
  document.getElementById('map-list').innerHTML = allStops.map(s=>`
    <a class="card" style="display:flex;justify-content:space-between;align-items:center"
       href="${mapUrl(s.map)}" target="_blank" rel="noopener">
      <span><b>${s.name}</b><br><span style="font-size:.82rem;color:var(--steel)">${s.map}</span></span>
      <span style="color:var(--gold-deep);font-weight:700">導航 ›</span>
    </a>`).join('');

  // ===== 相簿：共享照片(TRIP.album) + 本機照片(存 IndexedDB，僅本機可見) =====
  const gallery=document.getElementById('gallery');
  const statusEl=document.getElementById('photo-status');
  let localPhotos=[];  // {id, url, cap}

  // --- IndexedDB 小工具 ---
  function openDB(){return new Promise((res,rej)=>{
    const r=indexedDB.open('tripPhotos',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });}
  async function dbAdd(blob){const db=await openDB();return new Promise((res,rej)=>{
    const rq=db.transaction('photos','readwrite').objectStore('photos').add({blob,cap:'',ts:Date.now()});
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
  });}
  async function dbAll(){const db=await openDB();return new Promise((res,rej)=>{
    const rq=db.transaction('photos','readonly').objectStore('photos').getAll();
    rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error);
  });}
  async function dbDel(id){const db=await openDB();return new Promise((res,rej)=>{
    const rq=db.transaction('photos','readwrite').objectStore('photos').delete(id);
    rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error);
  });}

  const allPhotos=()=>[...TRIP.album, ...localPhotos.map(p=>({src:p.url,cap:p.cap}))];

  async function loadLocal(){
    localPhotos.forEach(p=>URL.revokeObjectURL(p.url));
    let rows=[]; try{ rows=await dbAll(); }catch(e){ rows=[]; }
    localPhotos=rows.map(r=>({id:r.id,url:URL.createObjectURL(r.blob),cap:r.cap||''}));
    renderGallery();
  }

  function renderGallery(){
    const repoN=TRIP.album.length, all=allPhotos();
    if(!all.length){
      gallery.innerHTML=`<div class="album-empty" style="grid-column:1/-1">📷 還沒有照片<br><small>按上面的按鈕從手機選照片</small></div>`;
      return;
    }
    gallery.innerHTML=all.map((p,i)=>{
      const isLocal=i>=repoN;
      return `<figure>
        <img src="${p.src}" alt="${p.cap||''}" loading="lazy" onclick="openLb(${i})">
        ${isLocal?`<button class="ph-del" onclick="delLocal(${i-repoN})" aria-label="刪除">✕</button><span class="ph-badge">本機</span>`:''}
        ${p.cap?`<figcaption>${p.cap}</figcaption>`:''}
      </figure>`;
    }).join('');
  }

  window.delLocal=async idx=>{ const p=localPhotos[idx]; if(!p)return;
    if(!confirm('要從這支手機移除這張照片嗎？')) return;
    try{ await dbDel(p.id); }catch(e){}
    await loadLocal();
  };

  // 選照片 → 壓縮 → 存 IndexedDB
  const input=document.getElementById('photo-input');
  input.onchange=async e=>{
    const files=[...e.target.files]; if(!files.length) return;
    statusEl.style.display='block';
    for(let n=0;n<files.length;n++){
      statusEl.textContent=`處理中… ${n+1}/${files.length}`;
      try{ const blob=await compress(files[n]); await dbAdd(blob); }
      catch(err){
        if(/quota|Quota|space|QUOTA/.test(String(err&&err.name)+String(err))){
          alert('這支手機的照片儲存空間已滿，無法再存更多。\n想全家共享的照片，可用 Discord 傳給我放進共享相簿。');
          break;
        }
      }
    }
    statusEl.style.display='none'; input.value='';
    await loadLocal();
  };

  // 用 canvas 壓縮（最長邊 1400px，JPEG 0.78）大幅縮小 iPhone 大照片
  function compress(file){
    return new Promise((resolve,reject)=>{
      const img=new Image(), url=URL.createObjectURL(file);
      img.onload=()=>{ URL.revokeObjectURL(url);
        const max=1400; let w=img.width,h=img.height;
        if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
        else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(b=> b?resolve(b):reject(new Error('blob-fail')), 'image/jpeg', 0.78);
      };
      img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img-fail')); };
      img.src=url;
    });
  }

  // 燈箱（涵蓋共享 + 本機照片）
  let lbIndex=0;
  window.openLb=i=>{lbIndex=i;showLb();document.getElementById('lightbox').classList.add('on')};
  window.closeLb=()=>document.getElementById('lightbox').classList.remove('on');
  window.stepLb=d=>{const a=allPhotos(); if(!a.length)return; lbIndex=(lbIndex+d+a.length)%a.length; showLb();};
  function showLb(){const p=allPhotos()[lbIndex]; if(!p)return;
    document.getElementById('lb-img').src=p.src; document.getElementById('lb-cap').textContent=p.cap||'';}
  document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')closeLb()};

  loadLocal();

  const KEY='trip_expenses_v1';
  const load=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
  const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
  document.getElementById('e-date').value=new Date().toISOString().slice(0,10);
  window.addExpense=()=>{
    const name=document.getElementById('e-name').value.trim();
    const amt=parseFloat(document.getElementById('e-amt').value);
    if(!name||!amt||amt<=0){alert('請填項目和金額');return;}
    const list=load();
    list.push({name,amt,cat:document.getElementById('e-cat').value,date:document.getElementById('e-date').value});
    save(list);
    document.getElementById('e-name').value='';document.getElementById('e-amt').value='';
    renderExpenses();
  };
  window.delExpense=i=>{const l=load();l.splice(i,1);save(l);renderExpenses();};
  function renderExpenses(){
    const list=load();
    const cats={};let grand=0;
    list.forEach(e=>{cats[e.cat]=(cats[e.cat]||0)+e.amt;grand+=e.amt;});
    const rate=parseFloat(document.getElementById('conv-rate-input').value)||4.76;
    if(!list.length){document.getElementById('totals-card').innerHTML='<div style="color:var(--steel);text-align:center">尚無支出</div>';}
    else{
      document.getElementById('totals-card').innerHTML =
        Object.keys(cats).map(c=>`<div class="totals"><span>${c}</span><span>¥${cats[c].toLocaleString()}</span></div>`).join('')
        + `<div class="totals grand"><span>總計</span><span>¥${grand.toLocaleString()} <small style="color:var(--steel);font-weight:500">≈ NT$${Math.round(grand/rate).toLocaleString()}</small></span></div>`;
    }
    document.getElementById('exp-list').innerHTML = list.length
      ? list.map((e,i)=>`<div class="exp-item">
          <div><span class="cat-tag">${e.cat}</span>${e.name}<br><span class="meta">${e.date}</span></div>
          <div><span class="amt">¥${e.amt.toLocaleString()}</span><span class="del" onclick="delExpense(${i})">刪除</span></div>
        </div>`).join('')
      : '<div style="color:var(--steel);text-align:center;padding:10px">還沒有記帳，新增第一筆吧！</div>';
  }
  renderExpenses();

  let dir='jpy2twd';
  window.swapConvert=()=>{dir=dir==='jpy2twd'?'twd2jpy':'jpy2twd';
    document.getElementById('conv-in-lbl').textContent=dir==='jpy2twd'?'輸入日幣金額 (¥)':'輸入台幣金額 (NT$)';
    doConvert();};
  window.doConvert=()=>{
    const rate=parseFloat(document.getElementById('conv-rate-input').value)||4.76;
    const v=parseFloat(document.getElementById('conv-in').value)||0;
    const out=document.getElementById('conv-out');
    if(dir==='jpy2twd') out.textContent=`¥${v.toLocaleString()} ≈ NT$${(v/rate).toLocaleString(undefined,{maximumFractionDigits:0})}`;
    else out.textContent=`NT$${v.toLocaleString()} ≈ ¥${(v*rate).toLocaleString(undefined,{maximumFractionDigits:0})}`;
    document.getElementById('conv-rate').textContent=`目前匯率：1 台幣 = ${rate} 日幣（¥100 ≈ NT$${(100/rate).toFixed(1)}）`;
    renderExpenses();
  };
  doConvert();
</script>
</body>
</html>
